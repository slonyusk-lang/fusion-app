<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusion App - Multi Videos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #000; color: #fff; text-align: center; }

    /* Instagram Stories Banner */
    .stories { display: flex; gap: 12px; padding: 10px; background: #111; overflow-x: auto; border-bottom: 1px solid #222; }
    .story { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #bc1888); display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; font-weight: bold; }

    /* Navigation Bar */
    .tab-bar { display: flex; justify-content: space-around; background: #1a1a1a; padding: 12px 0; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
    .tab-btn { background: none; border: none; color: #888; font-size: 15px; font-weight: bold; padding: 6px 14px; cursor: pointer; }
    .tab-btn.active { color: #fff; border-bottom: 2px solid #e1306c; }

    /* Feed Sections */
    .feed-section { display: none; padding: 15px; flex-direction: column; align-items: center; gap: 20px; }
    .feed-section.active { display: flex; }

    /* Card Styling */
    .post-card { background: #181818; width: 100%; max-width: 400px; border-radius: 12px; padding: 12px; border: 1px solid #282828; }
    .post-title { text-align: left; margin-bottom: 10px; font-size: 14px; color: #aaa; }

    /* YouTube Box (16:9 Landscape) */
    .youtube-box { width: 100%; padding-top: 56.25%; position: relative; border-radius: 8px; overflow: hidden; background: #000; }
    .youtube-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    /* TikTok Box (Vertical Short) */
    .tiktok-box { width: 100%; height: 550px; border-radius: 8px; overflow: hidden; background: #000; }
    .tiktok-box iframe { width: 100%; height: 100%; border: 0; }

    /* Actions */
    .actions { display: flex; justify-content: space-around; margin-top: 10px; padding-top: 8px; border-top: 1px solid #222; }
    .action-btn { background: none; border: none; color: #fff; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 1. Instagram Stories Banner -->
  <div class="stories">
    <div class="story">You</div>
    <div class="story">User 1</div>
    <div class="story">User 2</div>
    <div class="story">User 3</div>
  </div>

  <!-- 2. Navigation Tabs -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('tiktok', this)">🎵 TikTok Reels</button>
    <button class="tab-btn" onclick="switchTab('youtube', this)">📺 YouTube Feed</button>
  </div>

  <!-- 3. TikTok Multi-Video Feed -->
  <div id="tiktok-feed" class="feed-section active">

    <!-- TikTok Video 1 -->
    <div class="post-card">
      <div class="post-title">🎵 TikTok Reel #1</div>
      <div class="tiktok-box">
        <iframe src="https://www.tiktok.com/player/v1/6718335390845095173" allowfullscreen></iframe>
      </div>
      <div class="actions">
        <button class="action-btn" onclick="alert('Liked!')">❤️ Like</button>
        <button class="action-btn">💬 Comment</button>
      </div>
    </div>

    <!-- TikTok Video 2 -->
    <div class="post-card">
      <div class="post-title">🎵 TikTok Reel #2</div>
      <div class="tiktok-box">
        <iframe src="https://www.tiktok.com/player/v1/7100000000000000000" allowfullscreen></iframe>
      </div>
      <div class="actions">
        <button class="action-btn" onclick="alert('Liked!')">❤️ Like</button>
        <button class="action-btn">💬 Comment</button>
      </div>
    </div>

  </div>

  <!-- 4. YouTube Multi-Video Feed -->
  <div id="youtube-feed" class="feed-section">

    <!-- YouTube Video 1 -->
    <div class="post-card">
      <div class="post-title">📺 YouTube Video #1</div>
      <div class="youtube-box">
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
      </div>
      <div class="actions">
        <button class="action-btn" onclick="alert('Liked!')">❤️ Like</button>
        <button class="action-btn">💬 Comment</button>
      </div>
    </div>

    <!-- YouTube Video 2 -->
    <div class="post-card">
      <div class="post-title">📺 YouTube Video #2</div>
      <div class="youtube-box">
        <iframe src="https://www.youtube.com/embed/L_LUpnjgPso" allowfullscreen></iframe>
      </div>
      <div class="actions">
        <button class="action-btn" onclick="alert('Liked!')">❤️ Like</button>
        <button class="action-btn">💬 Comment</button>
      </div>
    </div>

  </div>

  <!-- JavaScript to switch tabs -->
  <script>
    function switchTab(platform, element) {
      document.getElementById('tiktok-feed').classList.remove('active');
      document.getElementById('youtube-feed').classList.remove('active');

      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));

      document.getElementById(platform + '-feed').classList.add('active');
      element.classList.add('active');
    }
  </script>

</body>
</html>
