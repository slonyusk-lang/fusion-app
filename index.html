<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusion App</title>
  <style>
    body { font-family: sans-serif; background: #000; color: #fff; margin: 0; text-align: center; }
    .stories { display: flex; gap: 10px; padding: 10px; background: #111; overflow-x: auto; }
    .story { width: 50px; height: 50px; border-radius: 50%; background: red; flex-shrink: 0; line-height: 50px; font-size: 10px; }
    .card { height: 80vh; margin: 10px; background: #222; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!-- Instagram Style Stories -->
  <div class="stories">
    <div class="story">You</div>
    <div class="story">User 1</div>
    <div class="story">User 2</div>
  </div>

  <!-- TikTok / YouTube Style Feed -->
  <div class="card">
    <h2>▶️ TikTok / YouTube Feed Demo</h2>
  </div>

</body>
</html>
